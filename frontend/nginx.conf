server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compress text responses and keep immutable, content-hashed CRA assets in the
  # browser cache. The HTML entry point is deliberately revalidated so a deploy
  # can reference new hashes immediately.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location /static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # Public movie banners are not content-hashed, so cache them for a shorter
  # period and allow updated artwork to reach users without a hard refresh.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
    access_log off;
  }

  # Keep browser API calls on the same origin in Docker deployments. This avoids
  # baking localhost:5000 into the bundle, which otherwise targets each visitor's
  # own machine instead of the Compose server container.
  location /api/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
